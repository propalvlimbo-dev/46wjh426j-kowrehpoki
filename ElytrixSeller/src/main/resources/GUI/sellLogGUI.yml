title: "&#F8BEFBЛоги продаж &7{target} &8[{page}/{total}]"
size: 54

special-slots:
  - 0-44

animation:
  enabled: false
  sound: "BLOCK_NOTE_BLOCK_PLING"

log_item:
  fallback-material: PAPER
  name: "&7« &#F8BEFB{item_id} &8x{amount} &7»"
  lore:
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fИгрок: &#F8BEFB{player}'
    - '&#F8BEFB&l┃ &fМонет получено: &a+{coins}'
    - '&#F8BEFB&l┃ &fОчков получено: &a+{points}'
    - '&#F8BEFB&l┃ &fИсточник: &#F8BEFB{source}'
    - '&#F8BEFB&l┃ &fДата: &#F8BEFB{date}'
    - '&#F8BEFB&l┃ '
    - '&#F8BEFB&l┃ &fУровень: &#F8BEFB{level}'
    - '&#F8BEFB&l┃ &fБустер монет: &#F8BEFBx{coin_booster}'
    - '&#F8BEFB&l┃ &fБустер очков: &#F8BEFBx{point_booster}'
    - '&#F8BEFB&l┃ &fМир: &#F8BEFB{world}'
    - '&#F8BEFB&l┃ '

items:
  prev_page:
    material: black_dye
    name: "&7« &#F8BEFBНазад &7»"
    slot: 49
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fПредыдущая страница'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите для перехода'
    left_click_actions:
      - "[prev_page]"
    right_click_actions:
      - "[prev_page]"

  page_info:
    material: BOOK
    name: "&7« &#F8BEFBСтраница {page}/{total} &7»"
    slot: 50
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fВсего записей: &#F8BEFB{total_entries}'
      - '&#F8BEFB&l┃ &fФильтр от: &#F8BEFB{filter_from}'
      - '&#F8BEFB&l┃ &fФильтр до: &#F8BEFB{filter_to}'
      - '&#F8BEFB&l┃ &fСортировка: &#F8BEFB{sort_field} {sort_order}'
      - '&#F8BEFB&l┃ '

  sort_field:
    material: HOPPER
    name: "&7« &#F8BEFBСортировка: {sort_field} &7»"
    slot: 47
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fТекущее поле: &#F8BEFB{sort_field}'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите для переключения'
      - '&7● date → coins → points → amount'
    left_click_actions:
      - "[toggle_sort]"
    right_click_actions:
      - "[toggle_sort]"

  sort_order:
    material: COMPARATOR
    name: "&7« &#F8BEFBПорядок: {sort_order} &7»"
    slot: 48
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fТекущий: &#F8BEFB{sort_order}'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите для переключения'
      - '&7● ↓ убыв. ↔ ↑ возр.'
    left_click_actions:
      - "[toggle_order]"
    right_click_actions:
      - "[toggle_order]"

  next_page:
    material: black_dye
    name: "&7« &#F8BEFBДалее &7»"
    slot: 51
    lore:
      - '&#F8BEFB&l┃ '
      - '&#F8BEFB&l┃ &fСледующая страница'
      - '&#F8BEFB&l┃ '
      - '&7● &fНажмите для перехода'
    left_click_actions:
      - "[next_page]"
    right_click_actions:
      - "[next_page]"

  decorate:
    material: purple_stained_glass_pane
    name: "&r"
    slots:
      - 45
      - 46
      - 52
      - 53
