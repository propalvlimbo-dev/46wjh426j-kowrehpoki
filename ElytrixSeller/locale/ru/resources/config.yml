numbers_format:
  placeholders:
    points: "%.2f~"
    points_needed: "%.2f~"
    multiplier_points: "%.2f~"
    multiplier_coins: "%.2f~"
    points_fornextlevel: "%.2f~"
  mainGUI:
    sell_price: "%.2f~"
    sell_points: "%.2f~"
