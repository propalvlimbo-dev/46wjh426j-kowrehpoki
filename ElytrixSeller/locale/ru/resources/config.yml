    coin-multiplier: 3.0
    point-multiplier: 3.0
  vip:
    coin-multiplier: 2.0
    point-multiplier: 2.0
  premium:
    coin-multiplier: 1.5
    point-multiplier: 1.5

sounds:
  sell: "ENTITY_EXPERIENCE_ORB_PICKUP"
  sell-volume: 1.0
  sell-pitch: 1.0
  autosell: "ENTITY_EXPERIENCE_ORB_PICKUP"
